# AIO POS — زپ فائل اپ لوڈ کریں، باقی کام یہ خود کرے گا
# 1) ریپو میں جو بھی .zip فائل اپ لوڈ ہو گی، یہ اسے کھولے گا
# 2) روٹ پر صرف index.html اور sw.js جائیں گی، باقی فالتو فائلیں چھوڑ دی جائیں گی
# 3) فولڈر (جیسے tools/) اور ان کی فائلیں اپنی جگہ پر جائیں گی
# 4) زپ فائل ڈیلیٹ کر کے کمٹ کرے گا، اور ویب سائٹ دوبارہ بنوائے گا
name: Auto Unzip & Deploy

on:
  push:
    branches: [main]
    paths: ['**.zip', '**.ZIP']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: auto-unzip
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        id: un
        run: |
          shopt -s nullglob globstar nocaseglob
          # روٹ پر جو فائلیں جانے دینی ہیں، یہاں لکھیں (سپیس سے الگ)
          ALLOW_ROOT="index.html sw.js"
          zips=( **/*.zip )
          if [ ${#zips[@]} -eq 0 ]; then echo "none=1" >> "$GITHUB_OUTPUT"; echo "کوئی زپ نہیں ملی"; exit 0; fi
          names=""
          for z in "${zips[@]}"; do
            echo "📦 کھول رہا ہوں: $z"
            tmp=$(mktemp -d)
            unzip -o -q "$z" -d "$tmp"
            rm -rf "$tmp/__MACOSX"
            # اگر زپ کے اندر ایک ہی فولڈر ہو (مثلاً DG-main/) تو اس کے اندر کی فائلیں لو
            top=( "$tmp"/* )
            if [ ${#top[@]} -eq 1 ] && [ -d "${top[0]}" ]; then src="${top[0]}"; else src="$tmp"; fi
            # ورک فلو اور git کی فائلیں کبھی نہ بدلیں
            rm -rf "$src/.github" "$src/.git"
            # روٹ کی فالتو فائلیں ہٹاؤ (فولڈر محفوظ رہیں گے)
            for f in "$src"/*; do
              [ -d "$f" ] && continue
              b=$(basename "$f")
              case " $ALLOW_ROOT " in
                *" $b "*) ;;
                *) echo "⛔ فالتو فائل چھوڑ دی: $b"; rm -f "$f" ;;
              esac
            done
            dest=$(dirname "$z")
            cp -a "$src"/. "$dest"/
            git rm -q --cached "$z" 2>/dev/null || true
            rm -f "$z"
            rm -rf "$tmp"
            names="$names $(basename "$z" .zip)"
            echo "✅ مکمل: $z"
          done
          echo "names=$names" >> "$GITHUB_OUTPUT"

      - name: Commit
        if: steps.un.outputs.none != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "کوئی تبدیلی نہیں"; exit 0; fi
          git commit -m "Auto-unzip:${{ steps.un.outputs.names }}"
          git pull --rebase origin main || true
          git push

      - name: Rebuild GitHub Pages
        if: steps.un.outputs.none != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build trigger skipped"
